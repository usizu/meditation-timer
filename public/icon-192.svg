<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
	<defs>
		<radialGradient id="bg" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#1a1030"/>
			<stop offset="100%" stop-color="#0a0a1a"/>
		</radialGradient>
		<linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#7b5ea7"/>
			<stop offset="50%" stop-color="#00e5ff"/>
			<stop offset="100%" stop-color="#7b5ea7"/>
		</linearGradient>
	</defs>
	<rect width="192" height="192" rx="40" fill="url(#bg)"/>
	<!-- stars -->
	<circle cx="30" cy="25" r="1.5" fill="#fff" opacity="0.7"/>
	<circle cx="160" cy="40" r="1" fill="#fff" opacity="0.5"/>
	<circle cx="45" cy="150" r="1.2" fill="#fff" opacity="0.6"/>
	<circle cx="150" cy="160" r="1" fill="#fff" opacity="0.4"/>
	<circle cx="80" cy="30" r="0.8" fill="#fff" opacity="0.5"/>
	<circle cx="120" cy="170" r="1.3" fill="#fff" opacity="0.6"/>
	<circle cx="170" cy="100" r="0.9" fill="#fff" opacity="0.5"/>
	<circle cx="20" cy="90" r="1.1" fill="#fff" opacity="0.4"/>
	<!-- timer ring -->
	<circle cx="96" cy="96" r="52" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
	<!-- inner glow -->
	<circle cx="96" cy="96" r="48" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.15"/>
	<!-- center dot -->
	<circle cx="96" cy="96" r="4" fill="#00e5ff" opacity="0.6"/>
</svg>
