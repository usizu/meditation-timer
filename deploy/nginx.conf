# Kitty Timer — nginx config
#
# Usage:
#   1. Copy this file to /etc/nginx/sites-available/kitty-timer
#   2. ln -s /etc/nginx/sites-available/kitty-timer /etc/nginx/sites-enabled/
#   3. Replace YOUR_DOMAIN with your actual domain
#   4. Replace /path/to/kitty-timer with the actual path
#   5. Run certbot for HTTPS: certbot --nginx -d YOUR_DOMAIN
#   6. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Redirect HTTP to HTTPS (certbot will add this automatically)
    # return 301 https://$host$request_uri;

    # ── Static PWA files ──
    root /path/to/kitty-timer/dist;
    index index.html;

    # ── AdonisJS server (auth, API, SSE, social pages) ──
    location /auth/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /friends {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /profile {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SSE (Datastar) — needs long-lived connections ──
    location /sse/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # ── AdonisJS server root (for / when authenticated — redirects to login) ──
    # This catches the AdonisJS home page at /
    # The PWA's index.html is served by the `try_files` below for non-server paths
    # We need a way to distinguish: if the user has a session cookie, proxy to AdonisJS
    # Otherwise, serve the static PWA.
    # For staging, just proxy / to AdonisJS too:
    location = / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static assets & PWA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caching for static assets ──
    location ~* \.(js|css|svg|png|woff2|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
